services:
  - type: web
    name: medicare-api
    runtime: node
    rootDir: MediCare-Simple/MediCare-Simple/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: medicare
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "10000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
